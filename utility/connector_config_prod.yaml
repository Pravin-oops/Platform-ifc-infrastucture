app:
  name: ifc-trigger-connector
  environment: PROD
  log_level: INFO

envelope:
  originating_systems:
    DEV: SNSVC0084379
    SIT: SNSVC0084378
    PROD-ANALYTICS: SNSVC0084375
    PROD-PARALLEL: SNSVC0084371
    PROD: SNSVC0084373
  tokenised_environments: [PROD]

run:
  shutdown_grace_seconds: 90

source:
  trigger_tables:
    TRIGGER_8: REPLACE_ME_PROD_DATABASE.REPLACE_ME_PROD_TRIGGER_8_TABLE
    TRIGGER_9: REPLACE_ME_PROD_DATABASE.REPLACE_ME_PROD_TRIGGER_9_TABLE
    TRIGGER_21: REPLACE_ME_PROD_DATABASE.REPLACE_ME_PROD_TRIGGER_21_TABLE
  athena:
    workgroup: primary
    catalog: AwsDataCatalog
    output_location: s3://REPLACE_ME_PROD_ATHENA_OUTPUT_BUCKET/athena_output/
    business_date_column: business_date
    order_by: [date_of_request, counterparty_csid_sds]
    poll_interval_seconds: 1.0
    query_timeout_seconds: 300

recon:
  enabled: true
  table: REPLACE_ME_PROD_DATABASE.REPLACE_ME_PROD_BATCH_RECON_TABLE
  trigger_targets:
    TRIGGER_8: REPLACE_ME_PROD_TRIGGER_8_RECON_TARGET
    TRIGGER_9: REPLACE_ME_PROD_TRIGGER_9_RECON_TARGET
    TRIGGER_21: REPLACE_ME_PROD_TRIGGER_21_RECON_TARGET

kafka:
  topic: REPLACE_ME_PROD_TOPIC
  bsp_config_path: utility/bsp_prod_config.yaml
  max_message_bytes: 819200
  flush_timeout_seconds: 120
  local_queue_max_messages: 20000
  overrides:
    request.timeout.ms: 60000
    connections.max.idle.ms: 300000
    metadata.max.age.ms: 300000

schema_registry:
  mode: SECURE
  ca_location: /tmp/ifc-certs/CARoot.pem
  timeout_seconds: 30
  max_attempts: 5
  schema_path: utility/schema.json
  secure:
    url: https://REPLACE_ME_PROD_SCHEMA_REGISTRY_HOST_1:8095, https://REPLACE_ME_PROD_SCHEMA_REGISTRY_HOST_2:8095
    token_refresh_margin_seconds: 300

ca_certificate:
  secret_id: REPLACE_ME_PROD_CA_BUNDLE_SECRET_ID
  secret_region: eu-west-1
  path: /tmp/ifc-certs/CARoot.pem

cyberark:
  enabled: false
  safe: Unx_CorpDLASP
  folder: Root
  object: INTRANET-sysEUWENGDEV
  client_cert_secret_id: REPLACE_ME_PROD_CYBERARK_CLIENT_CERT_SECRET_ID
  client_key_secret_id: REPLACE_ME_PROD_CYBERARK_CLIENT_KEY_SECRET_ID
  secret_region: eu-west-1
  ca_bundle_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  ssl_verify: true
  request_timeout: 30
  max_attempts: 3
  principal_realm: "@INTRANET.BARCAPINT.COM"

run_marker:
  path: s3://REPLACE_ME_PROD_RUN_MARKER_BUCKET/run-markers/run_markers.json

audit:
  bucket: s3://REPLACE_ME_PROD_AUDIT_BUCKET
  manifest_prefix: manifests/
  quarantine_prefix: quarantine/
  payload_prefix: payloads/
  write_payloads: true

resilience:
  max_publish_attempts: 5
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  circuit_breaker_threshold: 20
  circuit_breaker_reset_seconds: 120
  preflight_enabled: true
  preflight_timeout_seconds: 30
  preflight_metadata_enabled: false
  preflight_metadata_timeout_seconds: 60
  max_quarantine_ratio: 0.05

health:
  enabled: true
  port: 8080
  bind_host: 0.0.0.0

notifications:
  sns_topic_arn: null
  application_label: IFC Trigger Connector
  batch_sns_topic_arn: null
  trigger_originating_bu: UK-C
  batch_notifications_enabled: true
