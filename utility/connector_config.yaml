# IFC trigger connector - UAT.
#
# Placeholders marked CONFIRM are open items tracked in the README; they are the
# environment-readiness values the POC assessment lists as still outstanding.
#
# Any value here can be overridden per task without republishing this file, by
# setting an IFC_ environment variable in the ECS task definition. Sections are
# separated by a double underscore, e.g. IFC_KAFKA__TOPIC, IFC_RUN__TRIGGER.

app:
  name: ifc-trigger-connector
  environment: UAT
  log_level: INFO

run:
  # One ECS RunTask per trigger invocation: publish the month, then exit.
  # EventBridge Scheduler sets IFC_RUN__TRIGGER on every invocation.
  # Must be <= the task definition's stopTimeout (set to 120 in deploy/).
  shutdown_grace_seconds: 90

source:
  # Athena is the only source: each trigger's Iceberg table (built by the dbt
  # models on Databricks) is queried directly. The scheduler names the trigger
  # ("trigger 9", IFC_RUN__TRIGGER=TRIGGER_9, ...) and the run queries only that
  # trigger's table. No source.table fallback on purpose: an unmapped trigger
  # fails rather than reading another trigger's data.
  #
  # The tables hold only the attribute columns. Every envelope publishes
  # triggerType "KYCRefresh", with triggerSubType by trigger:
  # TRIGGER_8 -> NewHRCRelationship, TRIGGER_9 -> AccountInactivity,
  # TRIGGER_21 -> MultipleTMSARs.
  #
  # database.table per trigger, as shared by DevOps (SIT synthetic data).
  trigger_tables:
    TRIGGER_8: bdp_ifc_synthetic_data_test.bdp_corp_ifc_trigger_8
    TRIGGER_9: bdp_ifc_synthetic_data_test.bdp_corp_ifc_trigger_9
    TRIGGER_21: bdp_ifc_synthetic_data_test.bdp_corp_ifc_trigger_21
  athena:
    # CONFIRM: the workgroup the task role may use.
    workgroup: primary
    catalog: AwsDataCatalog
    # The DevOps stack's AthenaQueryResultsBucket + AthenaQureyResultsPrefix.
    # A workgroup that enforces its own result location overrides this.
    output_location: s3://sit1-logs-corpdeng-509153454187-eu-west-1/athena_output/
    # business_date is always the last day of the month the rows describe, so a
    # run reads the rows where it equals the last day of the previous month:
    # any run in September 2026 queries business_date = 2026-08-31, and a rerun
    # with IFC_RUN__MONTH=2026-08 queries 2026-07-31.
    business_date_column: business_date
    # Fixes row order, so a re-run allocates the same sequence numbers.
    order_by: [date_of_request, counterparty_csid_sds]
    poll_interval_seconds: 1.0
    query_timeout_seconds: 300

# Upstream reconciliation gate, checked after the run gate's skips and before
# any work: the run gate asks whether this month is due, this asks whether
# upstream produced anything to run for. The Databricks recon job appends a row
# per model run to the recon table; the newest row for the run's trigger
# (matched on target_table_name) must be from the current month (UTC), SUCCESS,
# with matching non-zero counts. FAILED (the dbt model did not run) and
# RECON_FAILED block the run and alert with the row's details. SUCCESS with
# both counts zero is a genuine empty month: exit 0, no alert, the month is
# recorded delivered and TBB gets a batch event with zero messages.
# The query runs through source.athena's workgroup, catalog and result location.
recon:
  enabled: true
  # The one batch recon table every trigger's rows are written to.
  table: bdp_ifc_synthetic_data_test.batch_recon
  # The target_table_name value each trigger's rows carry in batch_recon - the
  # Databricks table the trigger's model writes. A run reads only the rows
  # whose target_table_name is its own trigger's, matched ignoring backticks
  # and case, and the one with the latest last_modified_ts decides.
  trigger_targets:
    TRIGGER_8: "`sit_cds_snsvc0080860_prepared_db`.bdb_ifc_synthetic_data_test.BDP_Corp_IFC_Trigger_8"
    TRIGGER_9: "`sit_cds_snsvc0080860_prepared_db`.bdb_ifc_synthetic_data_test.BDP_Corp_IFC_Trigger_9"
    TRIGGER_21: "`sit_cds_snsvc0080860_prepared_db`.bdb_ifc_synthetic_data_test.BDP_Corp_IFC_Trigger_21"

kafka:
  # CONFIRM: the CDD trigger topic. The BSP topic table lists
  # tc01_fncmtrgrbb_ifc_tbb_kyc_refresh for CDD (DEV).
  topic: tc01_fncmtrgrbb_ifc_tbb_kyc_refresh
  # The BSP client YAML (librdkafka properties), not this file.
  bsp_config_path: s3://devaprocessedlayer-691850678096-emea/triggerbackbone/producer_app/config/bsp_uat_config.yaml
  # Broker limit is 800 KB; the guard sits just under it.
  max_message_bytes: 819200
  flush_timeout_seconds: 120
  local_queue_max_messages: 20000
  overrides: {}

schema_registry:
  mode: SECURE
  url: https://ldndsr000010177.intranet.barcapint.com:8095
  ca_location: /apps/external/5/deva/bsp/bsp-installer/bsp/etc/CARoot.pem
  timeout_seconds: 30
  token_refresh_margin_seconds: 300
  # Attempts at each registry request before preflight fails.
  max_attempts: 5
  schema_path: utility/schema.json

csm:
  base_url: https://csm-uk1-stg.barcapint.com:8200
  mount_point: CSM
  # CONFIRM: the actual system account. The POC readiness assessment lists this
  # as known-as-placeholder only.
  secret_path: intranet/static-cred/snsvc0035333_sysdevaemeammtdevops
  role_name: snsvc0035333_aws_ecs-csm-fetcher
  ca_bundle_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  ssl_verify: true
  sts_region: us-east-1
  instance_region: eu-west-1
  vault_server_id: CSM_PROD
  request_timeout: 30
  principal_realm: "@INTRANET.BARCAPINT.COM"

# Every invocation's outcome, appended as one JSON line to this file. The gate
# reads it to decide whether the month is already delivered; Athena reads the
# folder as a table (deploy/athena-run-markers.sql), so keep the folder to this
# one file. Unset the path to switch the entry-point gate off. See README,
# 'The invocation gate'.
run_marker:
  path: s3://sit1-pre-cds01-509153454187-eu-west-1/dbx-sit-cds-snsvc0080860-prepared-db/ifc-bdp-audit-recon-json/run-markers/run_markers.json

audit:
  # Either a bare bucket name or a full s3://bucket/folder URI. The prefixes
  # below are appended to it, so a URI naming a folder nests them under it.
  bucket: s3://sit1-pre-cds01-509153454187-eu-west-1/dbx-sit-cds-snsvc0080860-prepared-db/ifc-bdp-audit-recon-json/audit-bucket
  manifest_prefix: manifests/
  quarantine_prefix: quarantine/
  payload_prefix: payloads/
  # One S3 PUT per message. On for UAT so the control evidence exists during
  # onboarding; review before production volumes.
  write_payloads: true

resilience:
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0
  circuit_breaker_threshold: 20
  circuit_breaker_reset_seconds: 120
  preflight_enabled: true
  preflight_timeout_seconds: 10
  max_quarantine_ratio: 0.05

health:
  enabled: true
  port: 8080
  bind_host: 0.0.0.0

notifications:
  # CONFIRM: the RTB alerting topic.
  sns_topic_arn: null
  application_label: IFC Trigger Connector
  # CONFIRM: the Trigger Backbone batch-completion topic. Separate from the
  # RTB alerting topic above - this one carries a successful business event.
  batch_sns_topic_arn: null
  trigger_originating_bu: UK-C
  batch_notifications_enabled: true
